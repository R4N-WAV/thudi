name: Web version (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/dsp/**"
      - "presets/**"
      - "assets/**"
      - "tools/build_web.py"
      - "tools/web_smoke.mjs"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: wasi-sdk
        run: |
          curl -sSL -o wasi.tgz https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-25/wasi-sdk-25.0-x86_64-linux.tar.gz
          mkdir wasi && tar xzf wasi.tgz -C wasi --strip-components=1
      - name: Engine -> WebAssembly
        run: WASI_SDK=$PWD/wasi web/engine/build.sh
      - name: Assets and presets
        run: pip install pillow && python3 tools/build_web.py
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Smoke test (the wasm engine plays the RHYNO kit)
        run: node tools/web_smoke.mjs web/app/thudi.wasm presets/factory/kits/RHYNO.thudikit
      - name: "Publish to the gh-pages branch (Pages source: Deploy from branch, gh-pages)"
        run: |
          cd web/app
          touch .nojekyll
          git init -q && git checkout -q -b gh-pages
          git config user.name "thudi-ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -q -m "Thudi web for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
