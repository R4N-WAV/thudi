name: Build Thudi (Windows VST3)

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "art/**"
      - "**.md"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tools
        run: pip install numpy scipy

      - name: Configure
        shell: bash
        run: |
          mkdir -p out
          cmake -S . -B build -A x64 2>&1 | tee out/configure.log

      - name: Build plugin, tests and tools
        shell: bash
        run: cmake --build build --config Release --parallel --target Thudi_VST3 thudi_snapshot thudi_render 2>&1 | tee out/build.log; exit ${PIPESTATUS[0]}

      - name: Headless plugin checks + GUI screenshots
        shell: bash
        run: |
          ./build/thudi_snapshot_artefacts/Release/thudi_snapshot.exe out tests/rhyno_pattern.txt 2>&1 | tee out/checks.log; exit ${PIPESTATUS[0]}

      - name: RHYNO kit vs reference measurements
        shell: bash
        run: |
          ./build/Release/thudi_render.exe presets/factory/kits/RHYNO.thudikit tests/rhyno_pattern.txt out/engine_rhyno_pattern.wav 48000 2
          python tools/rhyno_metrics.py compare out/engine_rhyno_pattern.wav tests/rhyno_targets.json 2>&1 | tee out/metrics.log
          python tools/rhyno_metrics.py compare out/plugin_rhyno_pattern.wav tests/rhyno_targets.json 2>&1 | tee -a out/metrics.log; exit ${PIPESTATUS[0]}

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse build/Thudi_artefacts/Release/VST3/Thudi.vst3 package/
          Copy-Item INSTALL.md package/
          Compress-Archive -Path package/* -DestinationPath Thudi-VST3-Windows.zip -Force

      - name: Validate with pluginval
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $exe = Get-ChildItem -Recurse pluginval -Filter pluginval.exe | Select-Object -First 1
          $args = @("--strictness-level", "5", "--validate-in-process", "--timeout-ms", "600000", "--output-dir", "out/pv-log", "--validate", "package/Thudi.vst3")
          $p = Start-Process -FilePath $exe.FullName -ArgumentList $args -Wait -PassThru -NoNewWindow
          $log = Get-ChildItem -Recurse out/pv-log -Filter *.txt -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Copy-Item $log.FullName out/pluginval.log }
          if ($p.ExitCode -ne 0) { Write-Output "::error::pluginval failed (exit $($p.ExitCode))"; exit 1 }
          Write-Output "pluginval passed"

      - uses: actions/upload-artifact@v4
        with:
          name: Thudi-VST3-Windows
          path: Thudi-VST3-Windows.zip

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thudi-checks
          path: out/

      # Publish logs, screenshots and the plugin zip to the "ci-results" branch (readable without artifact downloads)
      - name: Publish results branch
        if: always()
        shell: bash
        run: |
          mkdir -p publish
          cp -r out/*.log out/*.png publish/ 2>/dev/null || true
          cp Thudi-VST3-Windows.zip publish/ 2>/dev/null || true
          if [ -f build.log ]; then cp build.log publish/; fi
          tail -c 200000 out/build.log > publish/build_tail.log 2>/dev/null || true
          rm -f publish/build.log
          cd publish
          git init -q
          git config user.name "thudi-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-results
          echo "run ${{ github.run_id }} commit ${{ github.sha }} status ${{ job.status }}" > STATUS.txt
          git add -A && git commit -q -m "CI results for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results
