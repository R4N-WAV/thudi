name: Build Thudi (Windows VST3)

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "art/**"
      - "**.md"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python tools
        run: pip install numpy scipy

      - name: Configure
        shell: bash
        run: |
          mkdir -p out
          cmake -S . -B build -A x64 2>&1 | tee out/configure.log

      - name: Build plugin, tests and tools
        shell: bash
        run: cmake --build build --config Release --parallel --target Thudi_VST3 thudi_snapshot thudi_render 2>&1 | tee out/build.log; exit ${PIPESTATUS[0]}

      - name: Headless plugin checks + GUI screenshots
        shell: bash
        run: |
          ./build/thudi_snapshot_artefacts/Release/thudi_snapshot.exe out tests/rhyno_pattern.txt 2>&1 | tee out/checks.log; exit ${PIPESTATUS[0]}

      - name: RHYNO kit vs reference measurements
        shell: bash
        run: |
          ./build/Release/thudi_render.exe presets/factory/kits/RHYNO.thudikit tests/rhyno_pattern.txt out/engine_rhyno_pattern.wav 48000 2
          python tools/rhyno_metrics.py compare out/engine_rhyno_pattern.wav tests/rhyno_targets.json 2>&1 | tee out/metrics.log
          python tools/rhyno_metrics.py compare out/plugin_rhyno_pattern.wav tests/rhyno_targets.json 2>&1 | tee -a out/metrics.log; exit ${PIPESTATUS[0]}

      - name: Collect plugin
        shell: pwsh
        run: |
          $src = "build/Thudi_artefacts/Release/VST3/Thudi.vst3"
          if (-not (Test-Path $src)) { throw "Built VST3 not found: $src" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item -Recurse -Force $src "dist/Thudi.vst3"
          Copy-Item INSTALL.md dist/

      - name: Validate with pluginval
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Invoke-WebRequest https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip -OutFile pluginval.zip
          Expand-Archive pluginval.zip -DestinationPath pluginval -Force
          $exe = Get-ChildItem -Recurse pluginval -Filter pluginval.exe | Select-Object -First 1
          $args = @("--strictness-level", "5", "--validate-in-process", "--timeout-ms", "600000", "--output-dir", "out/pv-log", "--validate", "dist/Thudi.vst3")
          $p = Start-Process -FilePath $exe.FullName -ArgumentList $args -Wait -PassThru -NoNewWindow
          $log = Get-ChildItem -Recurse out/pv-log -Filter *.txt -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Copy-Item $log.FullName out/pluginval.log }
          if ($p.ExitCode -ne 0) { Write-Output "::error::pluginval failed (exit $($p.ExitCode))"; exit 1 }
          Write-Output "pluginval passed"

      - name: Zip for the release
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath Thudi-VST3-Windows.zip -Force

      - name: Build the setup wizard (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $ok = (Test-Path $iscc) -and ((Get-Item $iscc).VersionInfo.FileVersionRaw -ge [version]"6.7.0")
          if (-not $ok) {
            Invoke-WebRequest "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe" -OutFile is.exe
            Start-Process .\is.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-" -Wait
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(Thudi VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DPluginDir=$PWD\dist" "/DOutDir=$PWD\installer" packaging\windows\thudi.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-ChildItem installer

      - name: Screenshots of the setup wizard (welcome page, folder page)
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot ($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$PWD\out\$name")
          }
          $p = Start-Process installer\Thudi-Setup-Windows.exe -PassThru
          Start-Sleep -Seconds 8
          Shot "wizard-1-welcome.png"
          $ws = New-Object -ComObject WScript.Shell
          $w = Get-Process | Where-Object { $_.MainWindowTitle -like "*Thudi*" } | Select-Object -First 1
          if ($w) { [void] $ws.AppActivate($w.Id) }
          Start-Sleep -Milliseconds 600
          [System.Windows.Forms.SendKeys]::SendWait("{ENTER}")
          Start-Sleep -Seconds 2
          Shot "wizard-2-folder.png"
          Get-Process | Where-Object { $_.ProcessName -like "Thudi-Setup*" -or $_.ProcessName -like "*.tmp" -or $_.MainWindowTitle -like "*Thudi*" } | Stop-Process -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Test the setup wizard (install, check, uninstall)
        shell: pwsh
        run: |
          $vst = "$env:CommonProgramFiles\VST3\Thudi.vst3"
          $bin = "$vst\Contents\x86_64-win\Thudi.vst3"
          New-Item -ItemType Directory -Force -Path "$vst\Contents\stale" | Out-Null
          $p = Start-Process installer\Thudi-Setup-Windows.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=setup.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content setup.log | Select-Object -Last 30; throw "setup failed ($($p.ExitCode))" }
          if (-not (Test-Path $bin)) { throw "not installed: $bin" }
          if (Test-Path "$vst\Contents\stale") { throw "the old version was not replaced" }
          if ((Get-FileHash $bin).Hash -ne (Get-FileHash "dist\Thudi.vst3\Contents\x86_64-win\Thudi.vst3").Hash) { throw "installed file differs" }
          $un = "${env:ProgramFiles}\R4N\Thudi\unins000.exe"
          if (-not (Test-Path $un)) { throw "uninstaller missing" }
          if (Get-ChildItem "$env:CommonProgramFiles\VST3" -Filter "unins*") { throw "uninstaller files in the VST3 folder" }
          Write-Output "installed OK"
          Start-Process $un -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait | Out-Null
          for ($i = 0; $i -lt 60 -and ((Test-Path $vst) -or (Test-Path $un)); $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $vst) { throw "uninstall left $vst" }
          if (Test-Path $un) { throw "uninstall left the uninstaller" }
          Write-Output "uninstalled OK" | Tee-Object -FilePath out/installer-test.log

      - name: Upload the setup wizard as a downloadable file
        uses: actions/upload-artifact@v4
        with:
          name: Thudi-Setup-Windows
          path: installer/Thudi-Setup-Windows.exe
          if-no-files-found: error
          retention-days: 90

      - name: Keep the zip, the setup and the screenshots for the release job
        shell: pwsh
        run: |
          Copy-Item installer\Thudi-Setup-Windows.exe .
          New-Item -ItemType Directory -Force -Path shots | Out-Null
          Get-ChildItem out\wizard-*.png -ErrorAction SilentlyContinue | Copy-Item -Destination shots

      - name: Upload for the release job
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            Thudi-VST3-Windows.zip
            Thudi-Setup-Windows.exe
            shots/*.png
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thudi-checks
          path: out/

      # Publish logs, screenshots and the plugin zip to the "ci-results" branch (readable without artifact downloads)
      - name: Publish results branch
        if: always()
        shell: bash
        run: |
          mkdir -p publish
          cp -r out/*.log out/*.png publish/ 2>/dev/null || true
          cp Thudi-VST3-Windows.zip Thudi-Setup-Windows.exe publish/ 2>/dev/null || true
          if [ -f build.log ]; then cp build.log publish/; fi
          tail -c 200000 out/build.log > publish/build_tail.log 2>/dev/null || true
          rm -f publish/build.log
          cd publish
          git init -q
          git config user.name "thudi-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ci-results
          echo "run ${{ github.run_id }} commit ${{ github.sha }} status ${{ job.status }}" > STATUS.txt
          git add -A && git commit -q -m "CI results for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-results

  publish:
    needs: [windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-latest
    steps:
      - name: Get the Windows build
        uses: actions/download-artifact@v4
        with:
          name: release-windows

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          ls -l Thudi-Setup-Windows.exe Thudi-VST3-Windows.zip
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          notes=$(printf '%s\n' \
            "Latest validated build from commit ${{ github.sha }}." \
            "" \
            "- **Windows** (VST3, 64-bit): **Thudi-Setup-Windows.exe**. Run it and click through the wizard (Windows may show *Windows protected your PC*: click *More info* > *Run anyway*), then rescan plugins in your host. Or the zip: Thudi-VST3-Windows.zip, copy Thudi.vst3 into C:\\Program Files\\Common Files\\VST3." \
            "" \
            "Full guide: INSTALL.md (also inside the zip).")
          shots=$(ls shots/wizard-*.png 2>/dev/null || true)
          gh release create latest Thudi-Setup-Windows.exe Thudi-VST3-Windows.zip $shots --target "${{ github.sha }}" --title "Thudi - latest build" --notes "$notes" --latest
