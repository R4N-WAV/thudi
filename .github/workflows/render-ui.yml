name: Render UI (Blender)

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "Cycles samples"
        default: "96"
  push:
    paths:
      - "art/**"
      - ".github/workflows/render-ui.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender
          key: blender-4.2.3-linux-x64

      - name: Download Blender 4.2 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -L -o blender.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          mkdir blender && tar -xf blender.tar.xz -C blender --strip-components=1

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y libxi6 libxxf86vm1 libxfixes3 libxrender1 libgl1 libegl1 libxkbcommon0 libsm6

      - name: Render
        shell: bash
        run: |
          SAMPLES="${{ github.event.inputs.samples || '96' }}"
          set -o pipefail
          ./blender/blender -b --factory-startup --python-exit-code 1 -P art/blender/render_ui.py -- assets/ui "$SAMPLES" 2>&1 | tee render.log | grep -vE "^Fra:|Sample [0-9]+/"
          ls -la assets/ui

      - uses: actions/upload-artifact@v4
        with:
          name: thudi-ui-renders
          path: assets/ui/*.png

      - name: Publish renders branch
        if: always()
        shell: bash
        run: |
          mkdir -p publish && cp assets/ui/*.png publish/ && (grep -vE "Sample [0-9]+/" render.log | tail -400 > publish/render.log || true)
          cd publish
          git init -q
          git config user.name "thudi-ci"; git config user.email "ci@users.noreply.github.com"
          git checkout -q -b ui-renders
          echo "run ${{ github.run_id }} commit ${{ github.sha }}" > STATUS.txt
          git add -A && git commit -q -m "UI renders for ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ui-renders
